services:
  ibase_seo.schema_builder:
    class: Drupal\ibase_seo\SchemaBuilder
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@language_manager'
      - '@breadcrumb'
      - '@current_route_match'
      - '@file_url_generator'

  ibase_seo.imported_duplicate_redirect:
    class: Drupal\ibase_seo\EventSubscriber\ImportedDuplicateRedirect
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@current_route_match'
      - '@current_user'
    tags:
      - { name: event_subscriber }
